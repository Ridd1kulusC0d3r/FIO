<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>F.I.O. Lab</title>
<script>
/* tema aplicado antes da pintura, para nao piscar */
try{var t=localStorage.getItem("fio_tema");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}
</script>
<style>
/* ===================================================== design system */
:root{
  --bg:#F3F5F9;--pn:#FFFFFF;--pn2:#EEF1F7;--pn3:#E3E8F1;
  --tx:#0F1A2E;--mu:#556079;--bd:#D6DCE8;--bd2:#C2CADB;
  --ac:#2F45B5;--ac2:#E6EAFB;--acf:#FFFFFF;
  --ok:#0B7A4F;--ok2:#DDF3E8;--wa:#8A5300;--wa2:#FBEBCB;--er:#B3202D;--er2:#FBE0E2;--in:#1B62B8;--in2:#DCEBFB;
  --sb:#0E1730;--sb2:#17224A;--sbt:#C9D2EC;--sbm:#8D9AC0;--sbh:#FFFFFF;
  --sh:0 1px 2px rgba(15,26,46,.06),0 6px 20px rgba(15,26,46,.06);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --r:12px;--r2:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1020;--pn:#121A2F;--pn2:#18223C;--pn3:#202B49;
  --tx:#E7ECF8;--mu:#9AA6C3;--bd:#27324F;--bd2:#364467;
  --ac:#8FA6FF;--ac2:#1E2850;--acf:#0A1020;
  --ok:#5FD7A2;--ok2:#12372B;--wa:#F2C06B;--wa2:#3B2E12;--er:#FF909A;--er2:#40181E;--in:#7FB6F5;--in2:#142C48;
  --sb:#070C1B;--sb2:#121A33;--sbt:#BAC5E6;--sbm:#7F8CB3;
  --sh:0 1px 0 rgba(255,255,255,.03)}}
:root[data-theme="dark"]{
  --bg:#0A1020;--pn:#121A2F;--pn2:#18223C;--pn3:#202B49;
  --tx:#E7ECF8;--mu:#9AA6C3;--bd:#27324F;--bd2:#364467;
  --ac:#8FA6FF;--ac2:#1E2850;--acf:#0A1020;
  --ok:#5FD7A2;--ok2:#12372B;--wa:#F2C06B;--wa2:#3B2E12;--er:#FF909A;--er2:#40181E;--in:#7FB6F5;--in2:#142C48;
  --sb:#070C1B;--sb2:#121A33;--sbt:#BAC5E6;--sbm:#7F8CB3;
  --sh:0 1px 0 rgba(255,255,255,.03)}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.01em}
h2{font-size:21px;font-weight:700}h3{font-size:15.5px;font-weight:650}h4{font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
p{margin:0 0 8px}a{color:var(--ac)}
code{font-family:var(--mono);font-size:.92em;background:var(--pn2);padding:1px 5px;border-radius:5px}
.mu{color:var(--mu)}.mono{font-family:var(--mono);font-size:12.5px;word-break:break-all}.ok{color:var(--ok)}.er{color:var(--er)}.wa{color:var(--wa)}.in{color:var(--in)}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:15px;height:15px}.ic.lg{width:24px;height:24px}
:focus-visible{outline:3px solid color-mix(in srgb,var(--ac) 55%,transparent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--ac);color:var(--acf);padding:8px 12px;border-radius:8px;z-index:100}
.skip:focus{top:8px}

/* ------------------------------------------------------------ layout */
.app{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:100%}
.side{border-right:1px solid #1F2B52;background:var(--sb);color:var(--sbt);display:flex;flex-direction:column;gap:6px;padding:14px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 10px;color:var(--sbh)}
.brand .lg{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#5B74F0,#38B6E8);display:grid;place-items:center;color:#fff}
.brand b{display:block;font-size:16px;letter-spacing:.01em;color:#fff}.brand small{color:var(--sbm);font-size:11.5px}
.side h4{color:var(--sbm);margin:14px 8px 4px}
.nv-i{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:9px;border:0;background:none;color:var(--sbt);cursor:pointer;text-align:left}
.nv-i:hover{background:var(--sb2);color:#fff}
.nv-i[aria-current="page"]{background:var(--sb2);color:#fff;box-shadow:inset 3px 0 0 #7C93FF}
.nv-i .cnt{margin-left:auto;font-size:11px;background:#2A3763;color:#DDE4FF;border-radius:99px;padding:0 7px}
.caso{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;color:var(--sbt);padding:7px 10px;border-radius:9px;cursor:pointer}
.caso:hover{background:var(--sb2)}.caso.on{background:var(--sb2);border-color:#2E3B6C;color:#fff}
.caso b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caso small{display:block;color:var(--sbm);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .btn.p{margin:2px 0 4px;justify-content:center;background:#6F86FF;border-color:#6F86FF;color:#08102A}
.side .btn.p:hover{filter:brightness(1.08);background:#6F86FF}
.side-foot{margin-top:auto;padding:12px 8px 2px;font-size:11.5px;color:var(--sbm);border-top:1px solid #1F2B52}
.side-foot b{color:#E9EDFB;display:block;font-size:12px}
.scrim{display:none}
.col{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.top{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--pn);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:20;min-height:60px}
.top .ttl{min-width:0}.top .ttl h1{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
#menu{display:none}
#tarefa{font-size:12.5px;color:var(--mu);max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:22px 24px 40px;min-width:0;width:100%;max-width:1500px;margin:0 auto;flex:1}
.pill{max-width:100%;display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--bd);background:var(--pn2);color:var(--mu);}
.top .pill{white-space:nowrap}
.pill.ok{background:var(--ok2);color:var(--ok);border-color:transparent}.pill.in{background:var(--in2);color:var(--in);border-color:transparent}
.pill.wa{background:var(--wa2);color:var(--wa);border-color:transparent}.pill.er{background:var(--er2);color:var(--er);border-color:transparent}
.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor}

/* ----------------------------------------------------------- controls */
.btn{white-space:nowrap;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--bd2);background:var(--pn);border-radius:var(--r2);padding:7px 12px;cursor:pointer;color:var(--tx);text-decoration:none;font-weight:550;line-height:1.2;min-height:34px}
.btn:hover{background:var(--pn2)}.btn:active{transform:translateY(1px)}
.btn.p{background:var(--ac);border-color:var(--ac);color:var(--acf)}.btn.p:hover{filter:brightness(1.1);background:var(--ac)}
.btn.g{border-color:transparent;background:transparent}.btn.g:hover{background:var(--pn2)}
.btn.s{padding:4px 9px;font-size:12.5px;min-height:28px}.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ico{padding:6px;min-width:34px;justify-content:center}.btn.s.ico{min-width:28px;padding:4px}
input,select,textarea{border:1px solid var(--bd2);background:var(--pn);border-radius:var(--r2);padding:7px 10px;min-width:0;min-height:34px}
input::placeholder,textarea::placeholder{color:var(--mu);opacity:.85}
input[type=checkbox]{min-height:0;width:16px;height:16px;accent-color:var(--ac);vertical-align:-3px}
textarea{width:100%;min-height:90px;font-family:var(--mono);font-size:12.5px}
label{display:block;font-size:12.5px;color:var(--mu);margin:10px 0 4px;font-weight:550}
label.in-l{display:inline-flex;align-items:center;gap:6px;margin:0;color:var(--tx)}
.fld{position:relative;display:flex;align-items:center}.fld .ic{position:absolute;left:9px;color:var(--mu);pointer-events:none}.fld input{padding-left:32px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.sb{justify-content:space-between}.grow{flex:1;min-width:0}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.card>h3:first-child{margin-bottom:8px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:99px;font-size:12px;border:1px solid var(--bd);color:var(--mu);background:var(--pn)}
.dotc{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}

/* callout do principio do produto */
.princ{display:flex;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--ac2);border:1px solid color-mix(in srgb,var(--ac) 30%,transparent);color:var(--tx);margin-bottom:14px}
.princ .ic{color:var(--ac);margin-top:2px}.princ b{display:block}.princ span{color:var(--mu);font-size:13px}
.princ.compacto{padding:8px 11px;font-size:12.5px;margin:10px 0 0}

/* metricas */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--pn);border:1px solid var(--bd);border-radius:var(--r);padding:14px;box-shadow:var(--sh);display:flex;gap:12px;align-items:flex-start;min-width:0}
.kpi .bx{width:36px;height:36px;border-radius:10px;background:var(--ac2);color:var(--ac);display:grid;place-items:center;flex:none}
.kpi.ok .bx{background:var(--ok2);color:var(--ok)}.kpi.wa .bx{background:var(--wa2);color:var(--wa)}.kpi.er .bx{background:var(--er2);color:var(--er)}
.kpi b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--mu)}

/* abas */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin:4px 0 16px;overflow-x:auto;scrollbar-width:thin}
.tab{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;cursor:pointer;border:0;border-bottom:2px solid transparent;background:none;color:var(--mu);white-space:nowrap;font-weight:550;text-transform:capitalize;border-radius:6px 6px 0 0}
.tab:hover{color:var(--tx);background:var(--pn2)}.tab[aria-selected="true"]{color:var(--ac);border-bottom-color:var(--ac);font-weight:650}
.tab .n{font-size:11px;background:var(--pn3);color:var(--mu);border-radius:99px;padding:0 6px;text-transform:none}

/* tabelas */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
tbody tr:hover td{background:color-mix(in srgb,var(--pn2) 70%,transparent)}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mu);font-weight:650;white-space:nowrap;background:var(--pn)}
.thb{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}.thb:focus-visible{outline:3px solid color-mix(in srgb,var(--ac) 55%,transparent);border-radius:4px}
.thb .ar{opacity:.35;font-size:10px}th[aria-sort="ascending"] .ar,th[aria-sort="descending"] .ar{opacity:1;color:var(--ac)}
.tb-bar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}.tb-bar .fld{flex:1;min-width:200px;max-width:380px}
.tb-bar .cnt{font-size:12.5px;color:var(--mu)}
.nv{display:inline-block;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:650;color:#fff;white-space:nowrap}
.nv.alta{background:#0B7F58}.nv.media{background:#9A6400}.nv.baixa{background:#C2501A}.nv.indiciaria{background:#5C6882}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nv{color:#08101F}:root:not([data-theme="light"]) .nv.alta{background:#34D399}:root:not([data-theme="light"]) .nv.media{background:#F5B83D}:root:not([data-theme="light"]) .nv.baixa{background:#FB8A55}:root:not([data-theme="light"]) .nv.indiciaria{background:#9BA6BF}}
:root[data-theme="dark"] .nv{color:#08101F}:root[data-theme="dark"] .nv.alta{background:#34D399}:root[data-theme="dark"] .nv.media{background:#F5B83D}:root[data-theme="dark"] .nv.baixa{background:#FB8A55}:root[data-theme="dark"] .nv.indiciaria{background:#9BA6BF}
.bar{height:8px;border-radius:99px;background:var(--pn3);overflow:hidden;min-width:60px}.bar i{display:block;height:100%;border-radius:99px;background:var(--ac)}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--pn3)}.stack i{display:block;height:100%}
pre{white-space:pre-wrap;background:var(--pn2);padding:12px;border-radius:var(--r2);font:12px/1.55 var(--mono);max-height:360px;overflow:auto;margin:10px 0 0;border:1px solid var(--bd)}

/* estados vazios, skeleton, toasts */
.vazio{padding:42px 18px;text-align:center;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:8px}
.vazio .bx{width:56px;height:56px;border-radius:16px;background:var(--pn2);display:grid;place-items:center;color:var(--mu);margin-bottom:4px}
.vazio b{color:var(--tx);font-size:15.5px}.vazio p{max-width:440px;margin:0}
.sk{position:relative;overflow:hidden;border-radius:var(--r);background:var(--pn2);min-height:18px}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--pn) 70%,transparent),transparent);transform:translateX(-100%);animation:sh 1.3s infinite}
@keyframes sh{to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.sk::after{animation:none}*{scroll-behavior:auto!important}}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:min(380px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--pn);border:1px solid var(--bd2);border-left:4px solid var(--in);border-radius:10px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.22);animation:ti .18s ease-out}
.toast .ic{margin-top:2px;color:var(--in)}
.toast.ok{border-left-color:var(--ok)}.toast.ok .ic{color:var(--ok)}.toast.er{border-left-color:var(--er)}.toast.er .ic{color:var(--er)}.toast.wa{border-left-color:var(--wa)}.toast.wa .ic{color:var(--wa)}
@keyframes ti{from{opacity:0;transform:translateY(8px)}}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--pn);color:var(--tx);width:min(560px,94vw);padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(5,10,25,.55)}
dialog input,dialog select,dialog textarea{width:100%}

/* --------------------------------------------------- painel / demo */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.hero .card{margin:0}
.demo{background:linear-gradient(135deg,var(--ac2),var(--pn));border-color:color-mix(in srgb,var(--ac) 35%,var(--bd))}
.steps{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:10px;counter-reset:s}
.steps li{display:flex;gap:12px;counter-increment:s}.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--ac);color:var(--acf);display:grid;place-items:center;font-weight:700;font-size:13px}
.casos-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.cc{display:block;width:100%;text-align:left;background:var(--pn);border:1px solid var(--bd);border-radius:var(--r);padding:14px;cursor:pointer;box-shadow:var(--sh)}
.cc:hover{border-color:var(--ac)}.cc b{display:block;margin:4px 0 2px}.cc small{color:var(--mu)}

/* ------------------------------------------------------------- grafo */
.gtools summary{margin-top:2px}.gtools{padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.gt-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gt-row .fld{flex:1;min-width:180px;max-width:300px}.gt-row select{max-width:170px}
.gt-l{color:var(--mu);font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;min-width:74px}
.fchip{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:99px;border:1px solid var(--bd2);background:var(--pn);cursor:pointer;font-size:12.5px;font-weight:550}
.fchip[aria-pressed="false"]{opacity:.5;text-decoration:line-through}
.fchip .ln{width:18px;height:0;border-top-width:3px;border-top-style:solid}
.fchip .c{color:var(--mu);font-weight:500}
.gmain{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px;align-items:start}
.gcanvas{position:relative;border:1px solid var(--bd);border-radius:var(--r);background:var(--pn);overflow:hidden;height:clamp(440px,68vh,720px);box-shadow:var(--sh);
  background-image:radial-gradient(color-mix(in srgb,var(--mu) 22%,transparent) 1px,transparent 1px);background-size:22px 22px}
svg#g{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
svg#g.pan{cursor:grabbing}
.gctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.gctl .btn{background:var(--pn);box-shadow:var(--sh)}
.gleg{position:absolute;left:10px;bottom:10px;right:60px;display:flex;flex-wrap:wrap;gap:5px;max-height:34%;overflow:auto}
.gleg .fchip{background:color-mix(in srgb,var(--pn) 92%,transparent);padding:2px 8px;font-size:11.5px}
.gcap{position:absolute;left:12px;top:10px;font-size:11.5px;color:var(--mu);background:color-mix(in srgb,var(--pn) 88%,transparent);padding:2px 8px;border-radius:99px;border:1px solid var(--bd);display:inline-flex;gap:5px;align-items:center;max-width:calc(100% - 70px)}
.gdet{max-height:clamp(440px,68vh,720px);overflow:auto;margin:0}
.nl{fill:var(--tx);font:600 10.5px var(--sans);paint-order:stroke;stroke:var(--pn);stroke-width:3.2px;stroke-linejoin:round;pointer-events:none}
.nd{cursor:pointer}.nd circle.b{stroke:var(--pn);stroke-width:1.8px}
.nd:focus,.nd:focus-visible{outline:none}.nd:focus-visible circle.b{stroke:var(--ac);stroke-width:3.5px}
.nd.alvo circle.b{stroke:var(--tx);stroke-width:2.6px}
.nd.sel circle.b{stroke:var(--ac);stroke-width:4px}
.nd.dim,.ed.dim{opacity:.13}.nd.dim .nl{opacity:0}
.ed line.v{stroke-linecap:round}.ed.pth line.v{stroke:var(--ac)!important;stroke-width:5px!important;stroke-opacity:1!important}.ed.sel line.v{stroke-opacity:1!important;stroke-width:5px!important}
.ring{fill:none;stroke:var(--ac);stroke-width:2.5px;stroke-dasharray:4 3;pointer-events:none}
.hit{stroke:transparent;stroke-width:12px;cursor:pointer;fill:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px;margin:8px 0}.kv dt{color:var(--mu)}.kv dd{margin:0;font-family:var(--mono);font-size:12px;word-break:break-word}
.lig{display:block;width:100%;text-align:left;background:var(--pn2);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin:7px 0;cursor:pointer}
.lig:hover{border-color:var(--ac)}.lig .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.prov{margin:8px 0 0;padding:8px 10px;border-radius:8px;background:var(--pn);border:1px dashed var(--bd2);font-size:12px}
.prov .a{display:inline-block;font:700 11px var(--mono);background:var(--ac2);color:var(--ac);padding:0 6px;border-radius:5px;margin-right:6px}
.conf{display:flex;align-items:center;gap:8px}.conf .bar{flex:1}.conf b{font-variant-numeric:tabular-nums}
.pstep{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}

/* observacoes */
.obs{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;border-left:5px solid var(--in);padding-left:12px}
.obs.alta{border-left-color:var(--er)}.obs.atencao{border-left-color:var(--wa)}.obs.info{border-left-color:var(--in)}
.obs .bx{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--in2);color:var(--in)}
.obs.alta .bx{background:var(--er2);color:var(--er)}.obs.atencao .bx{background:var(--wa2);color:var(--wa)}
.obs .ents{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}

@media (max-width:1100px){.gmain{grid-template-columns:1fr}.gdet{max-height:none}.hero{grid-template-columns:1fr}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:282px;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.4);visibility:hidden}
  body.nav .side{transform:none;visibility:visible}
  body.nav .scrim{display:block;position:fixed;inset:0;background:rgba(5,10,25,.55);z-index:35}
  #menu{display:inline-flex}
  .top{padding:8px 12px}.top .hide-m{display:none}
  main{padding:14px 12px 32px}
  .obs{grid-template-columns:auto 1fr}.obs>.act{grid-column:1/-1}
}
@media (max-width:520px){
  h2{font-size:19px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kpi{padding:10px;gap:8px}.kpi .bx{width:30px;height:30px}.kpi b{font-size:20px}
  .casos-g{grid-template-columns:1fr}.gcanvas{height:62vh}.gleg{right:10px;bottom:6px;max-height:26%}
  .gctl{flex-direction:row;right:8px;top:44px}.gcap{font-size:10.5px}
  .card{padding:13px}.tb-bar .fld{max-width:none}
  #bmodo,#boff{padding:2px 7px;font-size:11px}.hide-s,#boffx{display:none}#boff{padding:2px 6px}.top{gap:6px}
}
@media print{.side,.top,#toasts{display:none}}

<script>
"use strict";
/* ============================================================ base */
/* sessionStorage lanca SecurityError em iframe com armazenamento bloqueado (Colab) */
const guardar={ler(k){try{return sessionStorage.getItem(k)}catch(e){return null}},gravar(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};
const T=(location.hash.match(/t=([^&]+)/)||[])[1]||guardar.ler("fio_t")||"";
guardar.gravar("fio_t",T);
/* base da API relativa a pagina: funciona atras de proxy com prefixo (Colab, Codespaces) */
const BASE=(()=>{let b=location.pathname.replace(/workbench\/?$/,"");return b.endsWith("/")?b:b.replace(/[^\/]*$/,"")})();
history.replaceState(null,"",location.pathname);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const IC=(n,c="")=>`<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const pct=c=>Math.min(99,Math.round(c*100))+"%";           /* confiança nunca 100% */
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const ts=s=>String(s||"").replace("T"," ").slice(0,16)+" UTC";
const humano=s=>{s=String(s||"").replace(/[-_]/g," ");return s.charAt(0).toUpperCase()+s.slice(1)};
const CORES={telefone:"#4C7DF0",pessoa:"#E8A317",organizacao:"#1FB58A",email:"#A45CF0",dominio:"#14B8D4",
url:"#8A96AD",faixa:"#6B7A99",cep:"#EF5350",municipio:"#F4802E",documento:"#E5336B",diario:"#2E9BEA",
sancao:"#D92D2D","cpf-parcial":"#F26F96",prestadora:"#8CC63F",placa:"#C9A227"};
const corTipo=t=>CORES[t]||"#8A96AD";
const NIV={alta:"#0E9F6E",media:"#D08A00",baixa:"#E2662B",indiciaria:"#7B879E"};
const NIVN={alta:"Alta",media:"Média",baixa:"Baixa",indiciaria:"Indiciária"};
let EST=null,CASO=null,INFO=null,DADOS=null,EXPS=[],ABA="grafo",VIEW="painel",CASOS=[],HL=new Set(),PEND=null;
const GR={};

async function api(p,opt={}){const r=await fetch(BASE+"api"+p,{...opt,headers:{"X-FIO-Token":T,"Content-Type":"application/json",...(opt.headers||{})}});
 const j=await r.json().catch(()=>({erro:"resposta inválida"}));if(!r.ok)throw new Error(j.erro||r.status);return j}
const post=(p,b)=>api(p,{method:"POST",body:JSON.stringify(b)});

/* ---------------------------------------------------------- toasts */
function toast(msg,tipo="in",ms=4200){const el=document.createElement("div");el.className="toast "+tipo;
 el.innerHTML=IC(tipo==="ok"?"check":tipo==="er"?"oct":tipo==="wa"?"tri":"info")+`<div>${esc(msg)}</div>`;
 $("#toasts").append(el);setTimeout(()=>el.remove(),ms)}
const falha=e=>toast(e&&e.message||String(e),"er",6000);

/* ----------------------------------------------------------- tema */
function efetivo(){const t=document.documentElement.dataset.theme;return t||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}
function iconeTema(){$("#tema-i").setAttribute("href",efetivo()==="dark"?"#i-sun":"#i-moon")}
$("#tema").onclick=()=>{const n=efetivo()==="dark"?"light":"dark";document.documentElement.dataset.theme=n;
 try{localStorage.setItem("fio_tema",n)}catch(e){}iconeTema()};
try{matchMedia("(prefers-color-scheme:dark)").addEventListener("change",iconeTema)}catch(e){}iconeTema();

/* -------------------------------------------------- menu (mobile) */
const menu=on=>{document.body.classList.toggle("nav",on);$("#menu").setAttribute("aria-expanded",on)};
$("#menu").onclick=()=>menu(!document.body.classList.contains("nav"));$("#scrim").onclick=()=>menu(false);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){menu(false);if(GR.limpar&&$("#g"))GR.limpar()}
 if(e.key==="/"&&$("#gbusca")&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$("#gbusca").focus()}});

/* ----------------------------------------------- componentes de UI */
const kpi=(ic,v,l,tom="")=>`<div class="kpi ${tom}"><span class="bx">${IC(ic)}</span><div><b>${v}</b><span>${l}</span></div></div>`;
const vazio=(ic,t,p,acao="")=>`<div class="vazio"><span class="bx">${IC(ic,"lg")}</span><b>${t}</b><p>${p}</p>${acao}</div>`;
const skel=()=>`<div class="kpis">${'<div class="sk" style="height:76px"></div>'.repeat(4)}</div><div class="sk" style="height:46px;margin-bottom:14px"></div><div class="sk" style="height:320px"></div>`;
const princ=(c="")=>`<div class="princ ${c}">${IC("shield")}<div><b>Toda aresta mostra a sua proveniência. A confiança nunca é 100%.</b>
 <span>Cada vínculo carrega as fontes que o sustentam, com o grau Admiralty (A–F × 1–6). Corroborar aumenta a confiança, mas ela é limitada a 99%: o que o grafo diz é indício a conferir, não prova.</span></div></div>`;
const nivBadge=n=>`<span class="nv ${esc(n)}">${esc(NIVN[n]||n)}</span>`;
const confBar=(c,n)=>`<div class="conf"><b>${pct(c)}</b><div class="bar" role="img" aria-label="confiança ${pct(c)}"><i style="width:${Math.min(99,c*100)}%;background:${NIV[n]||"var(--ac)"}"></i></div>${nivBadge(n)}</div>`;

/* tabela ordenável e filtrável
   cols:[{t:"título",v:r=>valorParaOrdenar,h:r=>html(opcional)}] */
function tabela(host,{cols,rows,vazioMsg="Nada para mostrar.",filtro=true,ord=null,dir=1,extra=""}){
 const uid="tb"+Math.random().toString(36).slice(2,7);let q="",oi=ord,od=dir;
 host.insertAdjacentHTML("beforeend",`<div class="tb-bar">${filtro?`<div class="fld">${IC("search","sm")}<input type="search" id="${uid}q" placeholder="Filtrar…" aria-label="Filtrar tabela"></div>`:""}<span class="cnt" id="${uid}c" aria-live="polite"></span>${extra}</div>
 <div class="scroll"><table><thead><tr>${cols.map((c,i)=>`<th scope="col" data-i="${i}" ${c.v?'aria-sort="none"':""}>${c.v?`<button class="thb" type="button">${esc(c.t)}<span class="ar" aria-hidden="true">▲▼</span></button>`:esc(c.t)}</th>`).join("")}</tr></thead><tbody id="${uid}b"></tbody></table></div>`);
 const ths=()=>host.querySelectorAll(`th[data-i]`);
 const pintar=()=>{let r=rows.filter(x=>!q||cols.some(c=>c.v&&norm(c.v(x)).includes(q)));
  if(oi!==null&&cols[oi].v){const f=cols[oi].v;r=r.slice().sort((a,b)=>{const x=f(a),y=f(b);return (typeof x==="number"&&typeof y==="number"?x-y:String(x).localeCompare(String(y),"pt-BR",{numeric:true}))*od})}
  host.querySelector("#"+uid+"b").innerHTML=r.length?r.map(x=>`<tr>${cols.map(c=>`<td class="${c.cls||""}">${c.h?c.h(x):esc(c.v(x))}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${cols.length}" class="mu">${vazioMsg}</td></tr>`;
  host.querySelector("#"+uid+"c").textContent=`${r.length} de ${rows.length}`;
  ths().forEach(th=>{if(!cols[th.dataset.i].v)return;const on=+th.dataset.i===oi;th.setAttribute("aria-sort",on?(od>0?"ascending":"descending"):"none");
   th.querySelector(".ar").textContent=on?(od>0?"▲":"▼"):"▲▼"});
  if(host.afterPaint)host.afterPaint()};
 ths().forEach(th=>{const b=th.querySelector(".thb");if(b)b.onclick=()=>{const i=+th.dataset.i;if(oi===i)od=-od;else{oi=i;od=1}pintar()}});
 const qi=host.querySelector("#"+uid+"q");if(qi)qi.oninput=()=>{q=norm(qi.value.trim());pintar()};
 pintar()}

/* ============================================================ início */
function setTopo(t,s){$("#tit").textContent=t;$("#sub").textContent=s||"";document.title=t+" · F.I.O. Lab"}
function marcarNav(v){$$(".nv-i").forEach(b=>{if(b.dataset.v===v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
 $$("#casos .caso").forEach(b=>b.classList.toggle("on",VIEW==="caso"&&b.dataset.id===CASO))}
function modoBadge(){const u=EXPS[EXPS.length-1];const off=!u||(u.metricas&&!u.metricas.requisicoes);
 $("#boff").className="pill "+(off?"ok":"wa");$("#boffx").textContent=off?"offline":"consultou a rede"}

async function init(){
 if(!T){setTopo("F.I.O. Lab","token ausente");$("#main").innerHTML=vazio("lock","Token ausente","Abra o endereço impresso no terminal por <code>python -m fio lab bancada</code>. O token vai na URL e é a única credencial desta sessão.");return}
 $("#main").innerHTML=skel();
 try{EST=await api("/estado")}catch(e){setTopo("F.I.O. Lab","sem conexão");$("#main").innerHTML=vazio("oct","Não foi possível conectar",esc(e.message));return}
 $("#versao").textContent="v"+EST.versao;
 $("#ambiente").textContent=/colab|googleusercontent|prod\.colab/.test(location.hostname)?"Colab":"local";
 $("#bases").innerHTML=Object.entries(EST.bases_legais).map(([k,v])=>`<option value="${esc(k)}">${esc(v)}</option>`).join("");
 $$(".nv-i").forEach(b=>b.onclick=()=>{menu(false);ir(b.dataset.v)});
 await listarCasos();painel()}

async function listarCasos(){CASOS=await api("/casos");
 $("#casos").innerHTML=CASOS.length?CASOS.map(c=>`<button class="caso" role="listitem" data-id="${esc(c.id)}"><b>${esc(c.id)}</b><small>${esc(c.titulo)}</small></button>`).join(""):'<div style="padding:4px 10px;font-size:12.5px;color:var(--sbm)">nenhum caso ainda</div>';
 $$("#casos .caso").forEach(el=>el.onclick=()=>{menu(false);abrir(el.dataset.id)});marcarNav(VIEW)}

function ir(v){
 if(v==="painel")return painel();
 if(["caso","grafo","obs","exp"].includes(v)){
  const id=CASO||(CASOS[0]&&CASOS[0].id);
  if(!id){toast("Crie um caso ou monte o caso de demonstração primeiro.","wa");return painel()}
  const a={caso:"resumo",grafo:"grafo",obs:"observações",exp:"experimentos"}[v];
  if(VIEW==="caso"&&CASO===id)return setAba(a);return abrir(id,a)}
 return vista(v)}

/* ============================================================ painel */
function painel(){VIEW="painel";CASO=null;marcarNav("painel");setTopo("Painel","visão geral da bancada");
 EXPS=[];modoBadge();
 const demo=CASOS.find(c=>c.id==="DEMO-FRAUDE-BOLETO");
 const tarefas=(EST.tarefas||[]).slice(0,6);
 $("#main").innerHTML=`${princ()}
 <div class="hero">
  <div class="card"><h2>Bem-vindo ao F.I.O. Lab</h2>

 ${tarefas.length?`<div class="card" style="margin-top:14px"><h3>Tarefas recentes</h3><div class="scroll"><table><thead><tr><th>#</th><th>tipo</th><th>caso</th><th>estado</th><th>criada (UTC)</th></tr></thead><tbody>${tarefas.map(t=>`<tr><td>${t.id}</td><td>${esc(t.tipo)}</td><td class="mono">${esc(t.caso)}</td><td class="${t.estado==="concluida"?"ok":/erro|falh/.test(t.estado)?"er":"mu"}">${esc(t.estado)}</td><td class="mono">${esc((t.criada||"").slice(0,16))}</td></tr>`).join("")}</tbody></table></div></div>`:""}`;

/* ============================================================== caso */

 catch(e){falha(e);$("#main").innerHTML=vazio("oct","Não foi possível abrir o caso",esc(e.message));return}
 const c=INFO.caso,E=encodeURIComponent(id);
 setTopo(c.titulo,`${c.id} · ${c.base_legal_texto}${c.expirado?" · EXPIRADO":""}`);modoBadge();
 const obs=(DADOS.observacoes||[]);const co=$("#cnt-obs");co.hidden=!obs.length;co.textContent=obs.length;
 const altas=DADOS.arestas.filter(a=>a.nivel==="alta").length;
 const tabs=[["resumo",""],["grafo",""],["vínculos",DADOS.arestas.length],["agrupamentos",DADOS.clusters.length],["observações",obs.length],["custódia",INFO.ledger],["experimentos",EXPS.length],["quesitos",c.quesitos.length]];
 $("#main").innerHTML=`<div class="row sb" style="margin-bottom:14px;align-items:flex-start">
  <div class="row"><span class="pill ${c.expirado?"er":"in"}">${esc(c.modo||"passivo")}</span><span class="pill">${IC("lock","sm")}${esc(c.classificacao||"acesso restrito")}</span>
  <span class="mu" style="font-size:12.5px">escopo até ${esc((c.expira_em||"").slice(0,10))} · ${c.escopo.length} identificador(es) autorizados</span></div>
  <div class="row"><a class="btn s" target="_blank" rel="noopener" href="${BASE}api/casos/${E}/relatorio?modelo=tecnico&t=${T}">${IC("file","sm")}Relatório técnico</a>
  <a class="btn s" target="_blank" rel="noopener" href="${BASE}api/casos/${E}/relatorio?modelo=laudo&t=${T}">${IC("file","sm")}Laudo</a>
  <a class="btn s" target="_blank" rel="noopener" href="${BASE}api/casos/${E}/relatorio?modelo=relint&t=${T}">${IC("file","sm")}RELINT</a></div></div>
 <div class="kpis">${kpi("graph",INFO.entidades,"entidades")}${kpi("link",INFO.vinculos,"vínculos")}${kpi("check",altas,"vínculos de confiança alta","ok")}
  ${kpi("eye",obs.length,"observações analíticas",obs.some(o=>o.gravidade==="alta")?"er":obs.some(o=>o.gravidade==="atencao")?"wa":"")}${kpi("lock",INFO.ledger,"registros de custódia")}${kpi("q",c.quesitos.length,"quesitos")}</div>
 <div class="tabs" role="tablist" aria-label="Seções do caso">${tabs.map(([k,n])=>`<button class="tab" role="tab" data-t="${k}">${k}${n!==""?` <span class="n">${n}</span>`:""}</button>`).join("")}</div><div id="aba" role="tabpanel"></div>`;
 $$(".tab").forEach(el=>el.onclick=()=>setAba(el.dataset.t));
 setAba(aba)}
async function setAba(a){ABA=a;marcarNav(({"resumo":"caso","grafo":"grafo","observações":"obs","experimentos":"exp"})[a]||"caso");
 $$(".tab").forEach(el=>{const on=el.dataset.t===a;el.setAttribute("aria-selected",on);if(on){const t=el.parentElement;t.scrollLeft=el.offsetLeft-t.clientWidth/2+el.offsetWidth/2}});
 const A=$("#aba");if(!A)return;const d=DADOS,id=CASO;
 try{
 if(a==="resumo")return resumo(A);
 if(a==="grafo")return grafoView(A);
 if(a==="vínculos"){A.innerHTML=princ("compacto")+`<div class="card" id="tv" style="margin-top:14px"></div>`;
  const acha=l=>d.arestas.find(x=>x.relacao===l.relacao&&x.origem.endsWith(":"+l.entidade)&&x.destino.endsWith(":"+l.vinculada_a))||d.arestas.find(x=>x.relacao===l.relacao&&(x.origem.endsWith(":"+l.entidade)||x.destino.endsWith(":"+l.entidade)));
  const tv=$("#tv");tabela(tv,{rows:d.tabela.map(l=>({...l,_a:acha(l)})),ord:3,dir:-1,
   vazioMsg:"Nenhum vínculo encontrado. Rode o pipeline na aba Resumo.",
   cols:[{t:"entidade",v:l=>l.entidade,h:l=>`<span class="mono">${esc(l.entidade)}</span><div class="mu">${esc(l.tipo)}</div>`},
   {t:"relação",v:l=>l.relacao,h:l=>esc(humano(l.relacao))},
   {t:"vinculada a",v:l=>l.vinculada_a,h:l=>`<span class="mono">${esc(l.vinculada_a)}</span><div class="mu">${esc(l.tipo_vinculo)}</div>`},
   {t:"confiança",v:l=>l.confianca,h:l=>`<div style="min-width:170px">${confBar(l.confianca,l.nivel)}</div><div class="mu">${esc(l.admiralty)} · ${l.corroboracoes} corroboração(ões)</div>`},
   {t:"fontes",v:l=>l.coletores,h:l=>`${esc(l.coletores)}${l.evidencia?`<div class="mu mono" style="max-width:260px">${esc(String(l.evidencia).slice(0,90))}</div>`:""}`},
   {t:"",h:l=>l._a?`<button class="btn s" data-ar="${esc(l._a.id)}">${IC("graph","sm")}No grafo</button>`:""}]});
  tv.afterPaint=()=>$$("#tv [data-ar]").forEach(b=>b.onclick=()=>{PEND={aresta:b.dataset.ar};setAba("grafo")});tv.afterPaint();return}
 if(a==="agrupamentos"){A.innerHTML=(d.clusters.map(c=>`<div class="card"><div class="row sb"><div><span class="pill in">${esc(humano(c.tipo))}</span> <span class="mono">${esc(c.chave)}</span></div><span class="chip">força ${esc(c.forca)}</span></div>
  <p style="margin-top:8px">${esc(c.explicacao)}</p><p class="mu"><b>Ressalva:</b> ${esc(c.ressalva)}</p><div class="row" style="gap:5px">${c.membros.map(m=>`<span class="chip mono">${esc(m)}</span>`).join("")}</div>
  <div style="margin-top:10px"><button class="btn s" data-hl="${esc(JSON.stringify(c.membros))}">${IC("graph","sm")}Destacar no grafo</button></div></div>`).join("")||`<div class="card">${vazio("users","Nenhum agrupamento","Agrupamentos aparecem quando duas ou mais entidades compartilham indícios (bloco de numeração, sócio, endereço).")}</div>`)
  +(d.pontes.length?`<div class="card"><h3>Pontes entre alvos</h3><div class="scroll"><table><thead><tr><th>de</th><th>para</th><th>saltos</th><th>elo mais fraco</th><th>caminho</th></tr></thead><tbody>${d.pontes.slice(0,40).map(p=>`<tr><td class="mono">${esc(p.de)}</td><td class="mono">${esc(p.para)}</td><td>${p.saltos}</td><td>${esc(p.elo_mais_fraco)}</td><td>${p.intermediarios.map(i=>esc(i.rotulo)).join(" → ")||"direto"}</td></tr>`).join("")}</tbody></table></div></div>`:"");
  $$("[data-hl]").forEach(b=>b.onclick=()=>{const m=JSON.parse(b.dataset.hl);destacar(m.map(x=>d.entidades.find(e=>e.id===x||e.valor===x)?.id||x))});return}
 if(a==="observações")return observacoes(A);
 if(a==="custódia"){A.innerHTML='<div class="sk" style="height:200px"></div>';const l=await api(`/casos/${encodeURIComponent(id)}/ledger`);if(ABA!==a)return;
  A.innerHTML=`<div class="card"><div class="row">${l.integro?`<span class="pill ok">${IC("check","sm")}<b>Cadeia íntegra</b></span>`:`<span class="pill er">${IC("oct","sm")}<b>CADEIA COMPROMETIDA</b></span>`}<span class="mu">${l.registros.length} registros exibidos · cada registro encadeia o hash do anterior (SHA-256)</span></div>${l.problemas.map(p=>`<div class="er" style="margin-top:6px">${esc(p)}</div>`).join("")}</div><div class="card" id="tl"></div>`;
  tabela($("#tl"),{rows:l.registros.slice().reverse(),vazioMsg:"Sem registros.",cols:[{t:"#",v:r=>r.seq},{t:"UTC",v:r=>r.ts,cls:"mono"},{t:"ação",v:r=>r.acao},{t:"coletor",v:r=>r.coletor||""},{t:"alvo",v:r=>r.alvo||"",cls:"mono"},{t:"resumo",v:r=>r.resumo||""},{t:"hash",v:r=>r.hash.slice(0,12),cls:"mono"}]});return}
 if(a==="experimentos")return experimentos(A);
 if(a==="quesitos")return quesitos(A);
 }catch(e){falha(e)}}

/* ------------------------------------------------------------ resumo */
function resumo(A){const d=DADOS,id=CASO;const cols=Object.values(EST.inventario.coletores).flat();
 const nv={alta:0,media:0,baixa:0,indiciaria:0};d.arestas.forEach(a=>nv[a.nivel]=(nv[a.nivel]||0)+1);const tot=d.arestas.length||1;
 const tp={};d.entidades.forEach(e=>tp[e.tipo]=(tp[e.tipo]||0)+1);const mx=Math.max(1,...Object.values(tp));
 A.innerHTML=`${princ()}
 <div class="hero"><div class="card"><h3>Confiança dos vínculos</h3>
  ${d.arestas.length?`<div class="stack" role="img" aria-label="distribuição por nível de confiança" style="margin:10px 0">${Object.entries(nv).map(([k,v])=>`<i style="width:${v/tot*100}%;background:${NIV[k]}" title="${NIVN[k]}: ${v}"></i>`).join("")}</div>
  <div class="row" style="gap:14px">${Object.entries(nv).map(([k,v])=>`<span><span class="dotc" style="background:${NIV[k]}"></span> ${NIVN[k]} <b>${v}</b></span>`).join("")}</div>
  <p class="mu" style="margin-top:10px;font-size:12.5px">Níveis: alta ≥ 75%, média ≥ 50%, baixa ≥ 25%, indiciária abaixo disso. Nenhum vínculo passa de 99%.</p>`:vazio("link","Sem vínculos","Rode o pipeline para coletar e relacionar.")}</div>
  <div class="card"><h3>Entidades por tipo</h3><div style="display:grid;gap:7px;margin-top:10px">${Object.entries(tp).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row" style="flex-wrap:nowrap"><span style="width:110px;display:flex;gap:6px;align-items:center"><span class="dotc" style="background:${corTipo(k)}"></span>${esc(k)}</span><div class="bar grow"><i style="width:${v/mx*100}%;background:${corTipo(k)}"></i></div><b style="width:28px;text-align:right">${v}</b></div>`).join("")||'<span class="mu">sem entidades</span>'}</div></div></div>
 <div class="card"><h3>Adicionar alvo</h3><div class="row"><label for="atipo" class="sr">tipo</label><select id="atipo">${["telefone","email","dominio","cnpj","cep","pessoa","organizacao","documento"].map(t=>`<option>${t}</option>`).join("")}</select>
 <label for="avalor" class="sr">valor</label><input id="avalor" placeholder="(31) 98888-7777" style="flex:1;min-width:180px"><button class="btn p" id="aadd">${IC("plus","sm")}Adicionar alvo</button></div>
 <p class="mu" style="margin:8px 0 0;font-size:12.5px">O alvo precisa estar dentro do escopo autorizado do caso.</p></div>
 <div class="card"><details open><summary class="card-h" style="cursor:pointer;margin:0"><h3>Executar pipeline</h3><span class="mu">coleta → vínculos → análise</span></summary>
 <div class="row" style="margin-top:12px"><label class="in-l" for="pprof">profundidade</label><input id="pprof" type="number" min="0" max="3" value="1" style="width:68px">
 <label class="in-l"><input type="checkbox" id="poff"> só offline</label><label class="in-l"><input type="checkbox" id="pexp"> expandir escopo</label></div>
 <div class="row" style="margin-top:10px">${cols.map(k=>`<label class="chip in-l"><input type="checkbox" class="pcol" value="${esc(k.nome)}" checked> ${esc(k.nome)}${k.rede?' <span title="usa a rede">⇅</span>':""}</label>`).join("")}</div>
 <div class="row" style="margin-top:12px"><button class="btn p" id="prun">${IC("play","sm")}Rodar pipeline</button><span class="mu" id="pmsg"></span></div></details></div>`;
 $("#aadd").onclick=async()=>{try{await post(`/casos/${encodeURIComponent(id)}/alvos`,{tipo:$("#atipo").value,valor:$("#avalor").value});toast("Alvo adicionado.","ok");abrir(id,"resumo")}catch(e){falha(e)}};
 $("#prun").onclick=async()=>{const b={profundidade:+$("#pprof").value,offline:$("#poff").checked,expandir_escopo:$("#pexp").checked,
  coletores:$$(".pcol:checked").map(x=>x.value)};try{const r=await post(`/casos/${encodeURIComponent(id)}/pipeline`,b);$("#pmsg").textContent="tarefa #"+r.tarefa+" na fila";toast("Pipeline na fila (tarefa #"+r.tarefa+").");acompanhar(r.tarefa,()=>CASO===id&&abrir(id,"resumo"))}catch(e){falha(e)}}}

async function acompanhar(tid,fim){let t;try{t=await api("/tarefas/"+tid)}catch(e){return falha(e)}
 $("#tarefa").innerHTML=`#${tid} ${esc(t.estado)} ${esc((t.progresso||"").split("\n").pop())}`;
 if(t.estado==="fila"||t.estado==="rodando")return setTimeout(()=>acompanhar(tid,fim),900);
 const ok=t.estado==="concluida";$("#tarefa").innerHTML=`#${tid} <span class="${ok?"ok":"er"}">${esc(t.estado)}</span>`;
 toast(`Tarefa #${tid}: ${t.estado}.`,ok?"ok":"er");fim&&fim(t)}

/* ------------------------------------------------------- observações */
const SEV={alta:{ic:"oct",t:"Alta",o:0},atencao:{ic:"tri",t:"Atenção",o:1},info:{ic:"info",t:"Informativa",o:2}};
function observacoes(A){const obs=(DADOS.observacoes||[]);
 if(!obs.length){A.innerHTML=`<div class="card">${vazio("eye","Sem observações","Observações vêm dos analisadores (incoerência geográfica, intermediário provável, sanções…) e aparecem depois que o pipeline roda.",`<button class="btn p" id="irp">${IC("play","sm")}Ir para o pipeline</button>`)}</div>`;$("#irp").onclick=()=>setAba("resumo");return}
 const cont={};obs.forEach(o=>cont[o.gravidade]=(cont[o.gravidade]||0)+1);const ans=[...new Set(obs.map(o=>o.analisador))];
 let fg="",fa="",fq="";
 A.innerHTML=`<div class="kpis">${Object.entries(SEV).map(([k,s])=>kpi(s.ic,cont[k]||0,"gravidade "+s.t.toLowerCase(),k==="alta"?"er":k==="atencao"?"wa":"")).join("")}</div>
 <div class="princ compacto">${IC("info")}<div><b>Observação não é acusação.</b> <span>Cada item é um sinal a conferir, com o analisador que o gerou. A gravidade indica prioridade de revisão, não culpa.</span></div></div>
 <div class="tb-bar" style="margin-top:14px"><div class="fld">${IC("search","sm")}<input type="search" id="oq" placeholder="Filtrar observações…" aria-label="Filtrar observações"></div>
 <label class="sr" for="og">gravidade</label><select id="og"><option value="">todas as gravidades</option>${Object.entries(SEV).map(([k,s])=>`<option value="${k}">${s.t}</option>`).join("")}</select>
 <label class="sr" for="oa">analisador</label><select id="oa"><option value="">todos os analisadores</option>${ans.map(a=>`<option>${esc(a)}</option>`).join("")}</select><span class="cnt" id="oc"></span></div><div id="ol"></div>`;
 const pintar=()=>{const r=obs.filter(o=>(!fg||o.gravidade===fg)&&(!fa||o.analisador===fa)&&(!fq||norm(o.texto+o.tipo+o.analisador).includes(fq)))
  .sort((a,b)=>(SEV[a.gravidade]||{o:9}).o-(SEV[b.gravidade]||{o:9}).o);$("#oc").textContent=`${r.length} de ${obs.length}`;
  $("#ol").innerHTML=r.map((o,i)=>{const s=SEV[o.gravidade]||SEV.info;return `<div class="card obs ${esc(o.gravidade)}"><span class="bx" title="${s.t}">${IC(s.ic,"lg")}</span>
  <div><div class="row"><b>${esc(humano(o.tipo))}</b><span class="pill ${o.gravidade==="alta"?"er":o.gravidade==="atencao"?"wa":"in"}">${IC(s.ic,"sm")}${s.t}</span><span class="mu" style="font-size:12.5px">${esc(o.analisador)}</span></div>
  <p style="margin:6px 0 0">${esc(o.texto)}</p>${(o.entidades||[]).length?`<div class="ents">${o.entidades.map(e=>`<span class="chip mono">${esc(e.split(":").slice(1).join(":")||e)}</span>`).join("")}</div>`:""}</div>
  <div class="act">${(o.entidades||[]).length?`<button class="btn s" data-oi="${i}">${IC("graph","sm")}Destacar no grafo</button>`:""}</div></div>`}).join("")||`<div class="card">${vazio("search","Nenhuma observação com esse filtro","Ajuste a busca ou a gravidade.")}</div>`;
  $$("#ol [data-oi]").forEach(b=>b.onclick=()=>destacar(r[+b.dataset.oi].entidades))};
 $("#oq").oninput=e=>{fq=norm(e.target.value.trim());pintar()};$("#og").onchange=e=>{fg=e.target.value;pintar()};$("#oa").onchange=e=>{fa=e.target.value;pintar()};pintar()}

function destacar(ids){HL=new Set(ids);PEND={hl:true};toast(`${HL.size} entidade(s) destacada(s) no grafo.`);setAba("grafo")}

name: Bootstrap F.I.O. repository

on:
  push:
    paths:
      - ".bootstrap/READY"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild repository payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/fio.part* > /tmp/fio.b64
          base64 -d /tmp/fio.b64 > /tmp/fio.zip
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/fio.zip') as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f'corrupt payload entry: {bad}')
          print('payload ok')
          PY
          unzip -oq /tmp/fio.zip -d .
          rm -rf .bootstrap .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish F.I.O. Lab 2.2.0"
          git push

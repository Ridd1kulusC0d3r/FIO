name: Bootstrap F.I.O. repository

on:
  push:
    paths:
      - ".bootstrap/READY"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild repository payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/fio.part* > /tmp/fio.b64
          base64 -d /tmp/fio.b64 > /tmp/fio.tar.xz
          tar -xJf /tmp/fio.tar.xz -C .
          python tools/gerar_notebook.py
          python tools/gerar_notebook.py --checar
          rm -rf .bootstrap .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish F.I.O. Lab 2.2.0"
          git push

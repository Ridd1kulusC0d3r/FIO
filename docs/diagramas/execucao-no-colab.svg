<svg viewBox="0 0 980 420" role="img" xmlns="http://www.w3.org/2000/svg" class="diagrama" aria-label="No Colab, o navegador fala com a maquina virtual por um proxy autenticado do Google. Na maquina, o kernel roda o F.I.O. e a bancada em 127.0.0.1; o disco /content e temporario. O Google Drive guarda casos e indice entre sessoes, se voce autorizar. A internet traz a base da Receita e as fontes publicas."><style>
svg{color:#5B6770;background:#F3F5F4;font-family:'Atkinson Hyperlegible',system-ui,sans-serif}
.d-caixa{fill:#fff;stroke:#C9D1CD;stroke-width:1.2}.d-caixa-acc{stroke:#0E7C6B;stroke-width:2}
.d-tit{fill:#17212B;font-weight:700;font-family:'Zilla Slab',Georgia,serif}.d-txt{fill:#3C4852;font-size:13.5px}
.d-rot{fill:#5B6770;font-size:12.5px}.d-eyebrow{fill:#0E7C6B;font-size:12px;font-weight:700;letter-spacing:.08em}
.d-selo{fill:#0E7C6B;font-size:11.5px;font-weight:700}.d-seta{stroke:#5B6770;stroke-width:1.6}
.d-seta-acc{stroke:#0E7C6B}.d-anota{stroke:#0E7C6B;stroke-width:1.2;stroke-dasharray:3 4}
.d-faixa{fill:#E4F1EE;stroke:#0E7C6B;stroke-width:1.2}.d-portao{fill:#FFF4E0;stroke:#C98A1B;stroke-width:1.2}
.d-no{fill:#0E7C6B}.d-no-t{fill:#fff;font-weight:700;font-size:14px}.d-alvo{stroke:#17212B;stroke-width:3}
.d-bloq{stroke:#B4232E;stroke-width:1.6;stroke-dasharray:5 4}.d-rot-bloq{fill:#B4232E}
</style><defs><marker id="ex" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect x="20" y="40" width="200" height="120" rx="10" class="d-caixa"/><text x="36" y="68" class="d-tit" style="font-size:15px">Seu navegador</text><text x="36" y="92" class="d-txt">caderno (formulários)</text><text x="36" y="112" class="d-txt">mapa interativo</text><text x="36" y="132" class="d-txt">bancada (iframe/aba)</text><rect x="258" y="70" width="120" height="60" rx="10" class="d-portao"/><text x="318" y="96" text-anchor="middle" class="d-tit" style="font-size:13px">proxy Google</text><text x="318" y="116" text-anchor="middle" class="d-txt" style="font-size:12px">autenticado</text><rect x="416" y="20" width="330" height="300" rx="12" class="d-caixa d-caixa-acc"/><text x="432" y="46" class="d-eyebrow">MÁQUINA VIRTUAL DO COLAB</text><rect x="432" y="60" width="298" height="96" rx="10" class="d-caixa"/><text x="448" y="88" class="d-tit" style="font-size:14px">Kernel Python</text><text x="448" y="112" class="d-txt">F.I.O. (GitHub ou embutido)</text><text x="448" y="132" class="d-txt">bancada em 127.0.0.1:8765, token</text><rect x="432" y="172" width="298" height="130" rx="10" class="d-caixa"/><text x="448" y="200" class="d-tit" style="font-size:14px">/content (apagado ao fim)</text><text x="448" y="224" class="d-txt">índice local cnpj-local.sqlite</text><text x="448" y="244" class="d-txt">downloads da Receita, um por vez</text><text x="448" y="264" class="d-txt">laudos para baixar</text><rect x="784" y="40" width="176" height="120" rx="10" class="d-caixa"/><text x="800" y="68" class="d-tit" style="font-size:14px">Google Drive</text><text x="800" y="92" class="d-txt">opcional, com</text><text x="800" y="112" class="d-txt">confirmação LGPD</text><text x="800" y="132" class="d-txt">casos + índice</text><rect x="784" y="196" width="176" height="124" rx="10" class="d-caixa"/><text x="800" y="224" class="d-tit" style="font-size:14px">Internet</text><text x="800" y="248" class="d-txt">Receita (dados</text><text x="800" y="268" class="d-txt">abertos do CNPJ)</text><text x="800" y="288" class="d-txt">fontes públicas</text><line x1="220" y1="100" x2="254" y2="100" class="d-seta" marker-end="url(#ex)"/><line x1="378" y1="100" x2="428" y2="100" class="d-seta" marker-end="url(#ex)"/><line x1="746" y1="96" x2="780" y2="96" class="d-seta" marker-end="url(#ex)"/><text x="763.0" y="88.0" text-anchor="middle" class="d-rot">guarda</text><line x1="780" y1="124" x2="746" y2="124" class="d-seta" marker-end="url(#ex)"/><text x="763.0" y="142" text-anchor="middle" class="d-rot">copia p/ local</text><line x1="780" y1="246" x2="734" y2="236" class="d-seta" marker-end="url(#ex)"/><text x="757.0" y="262" text-anchor="middle" class="d-rot">baixa</text><rect x="20" y="344" width="940" height="56" rx="10" class="d-faixa"/><text x="40" y="368" class="d-tit" style="font-size:14px">Por que o índice é lido de uma cópia local</text><text x="40" y="388" class="d-txt" style="font-size:12.5px">o Drive é montado como sistema de arquivos de rede; sqlite com milhões de linhas fica lento nele. Guarda-se no Drive, consulta-se no /content.</text></svg>
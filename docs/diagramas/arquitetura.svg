<svg viewBox="0 0 980 380" role="img" xmlns="http://www.w3.org/2000/svg" class="diagrama" aria-label="Arquitetura: a politica do caso controla o pipeline de quatro estagios; coletores e analisadores sao plugins; tudo grava no ledger, no grafo e no registro de experimento."><style>
svg{color:#5B6770;background:#F3F5F4;font-family:'Atkinson Hyperlegible',system-ui,sans-serif}

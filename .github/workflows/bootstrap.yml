name: Bootstrap F.I.O. repository

on:
  push:
    paths:
      - ".bootstrap/READY"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rebuild repository payload
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .bootstrap/fio.full > /tmp/fio.tar.xz
          tar -xJf /tmp/fio.tar.xz -C .
          python tools/gerar_notebook.py
          python tools/gerar_notebook.py --checar
          # O GITHUB_TOKEN deste job não pode introduzir novos workflows.
          # Publicamos o código primeiro e instalamos os workflows pelo conector GitHub depois.
          rm -rf .bootstrap .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish F.I.O. Lab 2.2.0"
          git push

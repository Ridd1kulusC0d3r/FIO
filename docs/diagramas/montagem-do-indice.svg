<svg viewBox="0 0 980 300" role="img" xmlns="http://www.w3.org/2000/svg" class="diagrama" aria-label="Montagem do indice: para cada arquivo, baixa com retomada, processa filtrando a UF e apaga. Estabelecimentos primeiro, guardando as raizes da UF; depois Empresas e Socios so dessas raizes."><style>
svg{color:#5B6770;background:#F3F5F4;font-family:'Atkinson Hyperlegible',system-ui,sans-serif}
.d-caixa{fill:#fff;stroke:#C9D1CD;stroke-width:1.2}.d-caixa-acc{stroke:#0E7C6B;stroke-width:2}
.d-tit{fill:#17212B;font-weight:700;font-family:'Zilla Slab',Georgia,serif}.d-txt{fill:#3C4852;font-size:13.5px}
.d-rot{fill:#5B6770;font-size:12.5px}.d-eyebrow{fill:#0E7C6B;font-size:12px;font-weight:700;letter-spacing:.08em}
.d-selo{fill:#0E7C6B;font-size:11.5px;font-weight:700}.d-seta{stroke:#5B6770;stroke-width:1.6}
.d-seta-acc{stroke:#0E7C6B}.d-anota{stroke:#0E7C6B;stroke-width:1.2;stroke-dasharray:3 4}
.d-faixa{fill:#E4F1EE;stroke:#0E7C6B;stroke-width:1.2}.d-portao{fill:#FFF4E0;stroke:#C98A1B;stroke-width:1.2}
.d-no{fill:#0E7C6B}.d-no-t{fill:#fff;font-weight:700;font-size:14px}.d-alvo{stroke:#17212B;stroke-width:3}
.d-bloq{stroke:#B4232E;stroke-width:1.6;stroke-dasharray:5 4}.d-rot-bloq{fill:#B4232E}
</style><defs><marker id="ix" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text x="20" y="26" class="d-eyebrow">PARA CADA UM DOS ARQUIVOS, EM ORDEM</text><rect x="20" y="42" width="200" height="100" rx="10" class="d-caixa"/><text x="36" y="70" class="d-tit" style="font-size:15px">1. Baixar</text><text x="36" y="94" class="d-txt">retoma de onde parou</text><text x="36" y="114" class="d-txt">até 5 tentativas</text><rect x="270" y="42" width="220" height="100" rx="10" class="d-caixa d-caixa-acc"/><text x="286" y="70" class="d-tit" style="font-size:15px">2. Processar</text><text x="286" y="94" class="d-txt">lê direto do .zip</text><text x="286" y="114" class="d-txt">filtra pela UF</text><rect x="540" y="42" width="170" height="100" rx="10" class="d-caixa"/><text x="556" y="70" class="d-tit" style="font-size:15px">3. Apagar</text><text x="556" y="94" class="d-txt">libera o disco</text><text x="556" y="114" class="d-txt">antes do próximo</text><rect x="760" y="42" width="200" height="100" rx="10" class="d-caixa"/><text x="776" y="70" class="d-tit" style="font-size:15px">cnpj.sqlite</text><text x="776" y="94" class="d-txt">índice reverso</text><text x="776" y="114" class="d-txt">telefone → cadastro</text><line x1="220" y1="92" x2="266" y2="92" class="d-seta" marker-end="url(#ix)"/><line x1="490" y1="92" x2="536" y2="92" class="d-seta" marker-end="url(#ix)"/><line x1="710" y1="92" x2="756" y2="92" class="d-seta" marker-end="url(#ix)"/><text x="733.0" y="84.0" text-anchor="middle" class="d-rot">grava</text><path d="M625,142 C 625,190 120,190 120,146" class="d-anota" fill="none" marker-end="url(#ix)"/><text x="372" y="182" text-anchor="middle" class="d-rot">próximo arquivo · pico de disco ≈ o maior arquivo</text><text x="20" y="226" class="d-eyebrow">DUAS PASSAGENS PARA O FILTRO POR UF</text><rect x="20" y="240" width="300" height="46" rx="10" class="d-faixa"/><text x="36" y="268" class="d-txt">Estabelecimentos → raízes da UF</text><rect x="370" y="240" width="300" height="46" rx="10" class="d-faixa"/><text x="386" y="268" class="d-txt">Empresas e Sócios só dessas raízes</text><line x1="320" y1="263" x2="366" y2="263" class="d-seta" marker-end="url(#ix)"/><text x="690" y="262" class="d-rot">Empresas e Sócios não trazem UF;</text><text x="690" y="280" class="d-rot">por isso Estabelecimentos vem antes</text></svg>
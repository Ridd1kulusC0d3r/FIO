<svg viewBox="0 0 980 390" role="img" xmlns="http://www.w3.org/2000/svg" class="diagrama" aria-label="No Colab, o navegador acessa a maquina virtual pelo proxy autenticado do Google. O F.I.O. usa apenas o disco temporario /content; relatorios persistem somente por download explicito."><style>.d-caixa{fill:#fff;stroke:#D2D9D6;stroke-width:1.2}.d-caixa-acc{stroke:#0E7C6B;stroke-width:2}.d-tit{fill:#17212B;font-weight:700}.d-txt{fill:#2C3740;font-size:13.5px}.d-eyebrow{fill:#0E7C6B;font-size:12px;font-weight:700;letter-spacing:.08em}.d-seta{stroke:#5B6770;stroke-width:1.6}.d-seta-acc{stroke:#0E7C6B}.d-rot{fill:#5B6770;font-size:12.5px}.d-faixa{fill:#E1F0EC;stroke:#0E7C6B;stroke-width:1.2}.d-portao{fill:#FFF4E0;stroke:#E3B45B;stroke-width:1.2}</style><defs><marker id="ex" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect x="20" y="56" width="210" height="126" rx="10" class="d-caixa"/><text x="36" y="84" class="d-tit" style="font-size:15px">Seu navegador</text><text x="36" y="108" class="d-txt">caderno + formulários</text><text x="36" y="128" class="d-txt">frontend F.I.O. simplificado</text><text x="36" y="148" class="d-txt">bancada completa</text><text x="36" y="168" class="d-txt">download de relatórios</text><rect x="278" y="82" width="132" height="70" rx="10" class="d-portao"/><text x="344" y="110" text-anchor="middle" class="d-tit" style="font-size:13px">proxy Google</text><text x="344" y="132" text-anchor="middle" class="d-txt" style="font-size:12px">autenticado</text><rect x="450" y="26" width="330" height="282" rx="12" class="d-caixa d-caixa-acc"/><text x="466" y="52" class="d-eyebrow">MÁQUINA VIRTUAL DO COLAB</text><rect x="466" y="68" width="298" height="90" rx="10" class="d-caixa"/><text x="482" y="96" class="d-tit" style="font-size:14px">Kernel Python</text><text x="482" y="120" class="d-txt">F.I.O. (GitHub ou embutido)</text><text x="482" y="140" class="d-txt">127.0.0.1:8765 + token</text><rect x="466" y="176" width="298" height="112" rx="10" class="d-faixa"/><text x="482" y="204" class="d-tit" style="font-size:14px">/content/fio-runtime</text><text x="482" y="228" class="d-txt">casos + fila + índice por UF</text><text x="482" y="248" class="d-txt">temporário: apagado ao encerrar</text><text x="482" y="268" class="d-txt">sem Google Drive</text><rect x="824" y="82" width="136" height="126" rx="10" class="d-caixa"/><text x="840" y="110" class="d-tit" style="font-size:14px">Internet</text><text x="840" y="134" class="d-txt">Receita Federal</text><text x="840" y="154" class="d-txt">fontes públicas</text><text x="840" y="174" class="d-txt">GitHub</text><line x1="230" y1="116" x2="274" y2="116" class="d-seta" marker-end="url(#ex)"/><line x1="410" y1="116" x2="446" y2="116" class="d-seta" marker-end="url(#ex)"/><line x1="824" y1="146" x2="784" y2="146" class="d-seta" marker-end="url(#ex)"/><text x="804" y="136" text-anchor="middle" class="d-rot">consulta</text><path d="M466,286 C 360,350 170,348 122,188" class="d-seta d-seta-acc" fill="none" marker-end="url(#ex)"/><text x="284" y="350" text-anchor="middle" class="d-rot">download explícito do relatório/modelo</text><rect x="20" y="326" width="940" height="50" rx="10" class="d-faixa"/><text x="40" y="348" class="d-tit" style="font-size:14px">Regra de persistência</text><text x="40" y="366" class="d-txt" style="font-size:12.5px">nada é salvo automaticamente fora da VM; preservar uma saída exige ação explícita de download.</text></svg>
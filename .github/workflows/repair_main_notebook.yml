name: Repair main Colab notebook

on:
  push:
    paths:
      - ".github/workflows/repair_main_notebook.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Regenerate and validate notebook
        run: |
          set -euo pipefail
          python tools/gerar_notebook.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("colab/FIO_Lab_Colab.ipynb")
          raw = p.read_text(encoding="utf-8")
          data = json.loads(raw)
          assert data.get("nbformat") == 4
          assert len(data.get("cells", [])) >= 10
          print("VALID:", len(raw), "chars,", len(data["cells"]), "cells")
          PY
          python tools/gerar_notebook.py --checar
      - name: Commit repaired notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/repair_main_notebook.yml
          git add colab/FIO_Lab_Colab.ipynb .github/workflows/repair_main_notebook.yml
          git commit -m "fix(colab): regenerate valid notebook JSON"
          git push

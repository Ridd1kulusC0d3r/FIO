<svg viewBox="0 0 760 340" role="img" xmlns="http://www.w3.org/2000/svg" class="diagrama" aria-label="Jornada de um caso em seis passos: abrir o caso, adicionar alvos, rodar a coleta, revisar o mapa, responder quesitos e emitir o laudo. Pedidos fora do escopo sao bloqueados e anotados."><style>
svg{color:#5B6770;background:#F3F5F4;font-family:'Atkinson Hyperlegible',system-ui,sans-serif}
.d-caixa{fill:#fff;stroke:#C9D1CD;stroke-width:1.2}.d-caixa-acc{stroke:#0E7C6B;stroke-width:2}
.d-tit{fill:#17212B;font-weight:700;font-family:'Zilla Slab',Georgia,serif}.d-txt{fill:#3C4852;font-size:13.5px}
.d-rot{fill:#5B6770;font-size:12.5px}.d-eyebrow{fill:#0E7C6B;font-size:12px;font-weight:700;letter-spacing:.08em}
.d-selo{fill:#0E7C6B;font-size:11.5px;font-weight:700}.d-seta{stroke:#5B6770;stroke-width:1.6}
.d-seta-acc{stroke:#0E7C6B}.d-anota{stroke:#0E7C6B;stroke-width:1.2;stroke-dasharray:3 4}
.d-faixa{fill:#E4F1EE;stroke:#0E7C6B;stroke-width:1.2}.d-portao{fill:#FFF4E0;stroke:#C98A1B;stroke-width:1.2}
.d-no{fill:#0E7C6B}.d-no-t{fill:#fff;font-weight:700;font-size:14px}.d-alvo{stroke:#17212B;stroke-width:3}
.d-bloq{stroke:#B4232E;stroke-width:1.6;stroke-dasharray:5 4}.d-rot-bloq{fill:#B4232E}
</style><defs><marker id="jn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect x="20" y="20" width="220" height="104" rx="12" class="d-caixa d-caixa-acc"/><circle cx="50" cy="52" r="15" class="d-no"/><text x="50" y="57" text-anchor="middle" class="d-no-t">1</text><text x="74" y="58" class="d-tit" style="font-size:15px">Abrir o caso</text><text x="38" y="90" class="d-txt">base legal, finalidade</text><text x="38" y="110" class="d-txt">e escopo</text><rect x="270" y="20" width="220" height="104" rx="12" class="d-caixa"/><circle cx="300" cy="52" r="15" class="d-no"/><text x="300" y="57" text-anchor="middle" class="d-no-t">2</text><text x="324" y="58" class="d-tit" style="font-size:15px">Adicionar alvos</text><text x="288" y="90" class="d-txt">telefones, e-mails,</text><text x="288" y="110" class="d-txt">documentos</text><rect x="520" y="20" width="220" height="104" rx="12" class="d-caixa"/><circle cx="550" cy="52" r="15" class="d-no"/><text x="550" y="57" text-anchor="middle" class="d-no-t">3</text><text x="574" y="58" class="d-tit" style="font-size:15px">Rodar a coleta</text><text x="538" y="90" class="d-txt">o F.I.O. consulta</text><text x="538" y="110" class="d-txt">as fontes</text><rect x="520" y="200" width="220" height="104" rx="12" class="d-caixa"/><circle cx="550" cy="232" r="15" class="d-no"/><text x="550" y="237" text-anchor="middle" class="d-no-t">4</text><text x="574" y="238" class="d-tit" style="font-size:15px">Revisar o mapa</text><text x="538" y="270" class="d-txt">ligações, grupos,</text><text x="538" y="290" class="d-txt">observações</text><rect x="270" y="200" width="220" height="104" rx="12" class="d-caixa"/><circle cx="300" cy="232" r="15" class="d-no"/><text x="300" y="237" text-anchor="middle" class="d-no-t">5</text><text x="324" y="238" class="d-tit" style="font-size:15px">Responder quesitos</text><text x="288" y="270" class="d-txt">com o grau de</text><text x="288" y="290" class="d-txt">confiança</text><rect x="20" y="200" width="220" height="104" rx="12" class="d-caixa d-caixa-acc"/><circle cx="50" cy="232" r="15" class="d-no"/><text x="50" y="237" text-anchor="middle" class="d-no-t">6</text><text x="74" y="238" class="d-tit" style="font-size:15px">Emitir o laudo</text><text x="38" y="270" class="d-txt">ou o RELINT, com</text><text x="38" y="290" class="d-txt">a custódia</text><line x1="240" y1="72" x2="266" y2="72" class="d-seta" marker-end="url(#jn)"/><line x1="490" y1="72" x2="516" y2="72" class="d-seta" marker-end="url(#jn)"/><line x1="700" y1="124" x2="700" y2="196" class="d-seta" marker-end="url(#jn)"/><line x1="520" y1="252" x2="494" y2="252" class="d-seta" marker-end="url(#jn)"/><line x1="270" y1="252" x2="244" y2="252" class="d-seta" marker-end="url(#jn)"/><line x1="600" y1="124" x2="600" y2="160" class="d-bloq" marker-end="url(#jnb)"/><defs><marker id="jnb" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8"><path d="M1,1 L9,9 M9,1 L1,9" stroke="#B4232E" stroke-width="2.2"/></marker></defs><text x="588" y="150" text-anchor="end" class="d-rot d-rot-bloq">pivô fora do escopo:</text><text x="588" y="167" text-anchor="end" class="d-rot d-rot-bloq">bloqueado e anotado</text><text x="380" y="330" text-anchor="middle" class="d-rot">cada passo vira uma linha no registro de custódia</text></svg>
</style><defs><marker id="aq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect x="20" y="16" width="940" height="44" rx="10" class="d-portao"/><text x="490" y="44" text-anchor="middle" class="d-tit" style="font-size:14px">Política do caso: base legal · finalidade · escopo conferido a cada pivô · prazo · fontes vedadas</text><rect x="20" y="90" width="205" height="120" rx="10" class="d-caixa"/><text x="36" y="118" class="d-tit" style="font-size:15px">preparação</text><text x="36" y="142" class="d-txt">carrega plugins</text><text x="36" y="162" class="d-txt">versão das fontes</text><text x="36" y="182" class="d-txt">hash do código</text><line x1="225" y1="150" x2="261" y2="150" class="d-seta" marker-end="url(#aq)"/><rect x="265" y="90" width="205" height="120" rx="10" class="d-caixa d-caixa-acc"/><text x="281" y="118" class="d-tit" style="font-size:15px">coleta</text><text x="281" y="142" class="d-txt">ingestão: extrator</text><text x="281" y="162" class="d-txt">normalização: núcleo</text><text x="281" y="182" class="d-txt">enriquecimento: 10 fontes</text><line x1="470" y1="150" x2="506" y2="150" class="d-seta" marker-end="url(#aq)"/><rect x="510" y="90" width="205" height="120" rx="10" class="d-caixa"/><text x="526" y="118" class="d-tit" style="font-size:15px">análise</text><text x="526" y="142" class="d-txt">coerência geográfica</text><text x="526" y="162" class="d-txt">intermediários</text><text x="526" y="182" class="d-txt">sanções</text><line x1="715" y1="150" x2="751" y2="150" class="d-seta" marker-end="url(#aq)"/><rect x="755" y="90" width="205" height="120" rx="10" class="d-caixa"/><text x="771" y="118" class="d-tit" style="font-size:15px">relatório</text><text x="771" y="142" class="d-txt">técnico · MD · CSV</text><text x="771" y="162" class="d-txt">laudo (art. 158-B)</text><text x="771" y="182" class="d-txt">RELINT</text><line x1="490" y1="60" x2="490" y2="86" class="d-seta d-seta-acc" marker-end="url(#aq)"/><rect x="20" y="276" width="300" height="84" rx="10" class="d-faixa"/><text x="36" y="304" class="d-tit" style="font-size:14px">ledger</text><text x="36" y="328" class="d-txt" style="font-size:12.5px">SHA-256 encadeado + artefatos brutos</text><rect x="340" y="276" width="300" height="84" rx="10" class="d-faixa"/><text x="356" y="304" class="d-tit" style="font-size:14px">grafo</text><text x="356" y="328" class="d-txt" style="font-size:12.5px">entidades, arestas com fonte e Admiralty</text><rect x="660" y="276" width="300" height="84" rx="10" class="d-faixa"/><text x="676" y="304" class="d-tit" style="font-size:14px">experimento</text><text x="676" y="328" class="d-txt" style="font-size:12.5px">parâmetros, métricas, SHA-256 do grafo</text><line x1="122" y1="210" x2="170" y2="272" class="d-anota" marker-end="url(#aq)"/><line x1="367" y1="210" x2="170" y2="272" class="d-anota" marker-end="url(#aq)"/><line x1="612" y1="210" x2="470" y2="272" class="d-anota" marker-end="url(#aq)"/><line x1="857" y1="210" x2="790" y2="272" class="d-anota" marker-end="url(#aq)"/><text x="490" y="248" text-anchor="middle" class="d-rot">grava</text></svg>
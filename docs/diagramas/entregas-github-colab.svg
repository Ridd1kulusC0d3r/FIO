<svg viewBox="0 0 980 330" role="img" xmlns="http://www.w3.org/2000/svg" class="diagrama" aria-label="Um repositorio no GitHub alimenta tres entregas: o Colab baixa o codigo direto; a Release traz o zip para o computador; o Pages publica o manual. Uma tag dispara testes e publicacao."><style>
svg{color:#5B6770;background:#F3F5F4;font-family:'Atkinson Hyperlegible',system-ui,sans-serif}
.d-caixa{fill:#fff;stroke:#C9D1CD;stroke-width:1.2}.d-caixa-acc{stroke:#0E7C6B;stroke-width:2}
.d-tit{fill:#17212B;font-weight:700;font-family:'Zilla Slab',Georgia,serif}.d-txt{fill:#3C4852;font-size:13.5px}
.d-rot{fill:#5B6770;font-size:12.5px}.d-eyebrow{fill:#0E7C6B;font-size:12px;font-weight:700;letter-spacing:.08em}
.d-selo{fill:#0E7C6B;font-size:11.5px;font-weight:700}.d-seta{stroke:#5B6770;stroke-width:1.6}
.d-seta-acc{stroke:#0E7C6B}.d-anota{stroke:#0E7C6B;stroke-width:1.2;stroke-dasharray:3 4}
.d-faixa{fill:#E4F1EE;stroke:#0E7C6B;stroke-width:1.2}.d-portao{fill:#FFF4E0;stroke:#C98A1B;stroke-width:1.2}
.d-no{fill:#0E7C6B}.d-no-t{fill:#fff;font-weight:700;font-size:14px}.d-alvo{stroke:#17212B;stroke-width:3}
.d-bloq{stroke:#B4232E;stroke-width:1.6;stroke-dasharray:5 4}.d-rot-bloq{fill:#B4232E}
</style><defs><marker id="en" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect x="20" y="110" width="210" height="140" rx="10" class="d-caixa d-caixa-acc"/><text x="36" y="138" class="d-tit" style="font-size:15px">Repositório GitHub</text><text x="36" y="162" class="d-txt">código (só stdlib)</text><text x="36" y="182" class="d-txt">caderno do Colab</text><text x="36" y="202" class="d-txt">manual e diagramas</text><text x="36" y="222" class="d-txt">workflows de CI</text><text x="20" y="96" class="d-eyebrow">FONTE ÚNICA</text><rect x="330" y="20" width="250" height="86" rx="10" class="d-caixa"/><text x="346" y="48" class="d-tit" style="font-size:15px">Actions: testes</text><text x="346" y="72" class="d-txt">3 sistemas × Python 3.10–3.14</text><text x="346" y="92" class="d-txt">caderno em dia e executável</text><rect x="330" y="124" width="250" height="86" rx="10" class="d-caixa"/><text x="346" y="152" class="d-tit" style="font-size:15px">Actions: publicar (tag vX.Y.Z)</text><text x="346" y="176" class="d-txt">zip para leigos + caderno</text><text x="346" y="196" class="d-txt">manual no GitHub Pages</text><text x="700" y="26" class="d-eyebrow">TRÊS ENTREGAS</text><rect x="700" y="36" width="260" height="84" rx="10" class="d-caixa"/><text x="716" y="64" class="d-tit" style="font-size:14px">Google Colab</text><text x="716" y="88" class="d-txt">botão Abrir no Colab; baixa do</text><text x="716" y="108" class="d-txt">GitHub, recua para o embutido</text><rect x="700" y="134" width="260" height="70" rx="10" class="d-caixa"/><text x="716" y="162" class="d-tit" style="font-size:14px">Computador (Release)</text><text x="716" y="186" class="d-txt">zip + lançadores de dois cliques</text><rect x="700" y="218" width="260" height="70" rx="10" class="d-caixa"/><text x="716" y="246" class="d-tit" style="font-size:14px">Manual (Pages)</text><text x="716" y="270" class="d-txt">página pública para divulgar</text><line x1="230" y1="150" x2="326" y2="64" class="d-seta" marker-end="url(#en)"/><text x="278.0" y="99.0" text-anchor="middle" class="d-rot">push</text><line x1="230" y1="190" x2="326" y2="168" class="d-seta" marker-end="url(#en)"/><text x="278.0" y="171.0" text-anchor="middle" class="d-rot">tag</text><line x1="580" y1="158" x2="696" y2="162" class="d-seta" marker-end="url(#en)"/><line x1="580" y1="184" x2="696" y2="250" class="d-seta" marker-end="url(#en)"/><path d="M230,230 C 470,300 560,300 696,86" class="d-seta" fill="none" marker-end="url(#en)"/><text x="470" y="298" text-anchor="middle" class="d-rot">codeload do ramo main (sem Release)</text></svg>